<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستخرج الرسمي المطور</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --text: #333;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg); 
            padding: 20px; 
            direction: rtl; 
            color: var(--text);
            margin: 0;
        }

        /* واجهة الإدخال */
        .no-print { 
            max-width: 800px;
            margin: 0 auto 30px auto;
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        
        h2 { color: var(--primary); margin-top: 0; font-size: 20px; }
        
        textarea { 
            width: 100%; 
            height: 60px; 
            padding: 12px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            font-family: monospace;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        textarea:focus { border-color: var(--accent); outline: none; }

        .btn-action { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 12px 35px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            transition: transform 0.2s, background 0.3s;
        }
        
        .btn-action:hover { background: #2980b9; transform: translateY(-1px); }
        .btn-action:disabled { background: #95a5a6; cursor: not-allowed; transform: none; }

        /* تنسيق ورقة التقرير PDF */
        #pdf-content { 
            background: white; 
            padding: 15mm 20mm; 
            width: 210mm; 
            margin: auto;
            min-height: 297mm;
            display: none; 
            box-sizing: border-box;
            position: relative;
        }

        .header { 
            text-align: center; 
            border-bottom: 3px double var(--primary); 
            margin-bottom: 30px; 
            padding-bottom: 20px; 
        }
        
        .header h1 { margin: 0; font-size: 28px; color: var(--primary); }
        .header p { margin: 5px 0; color: #7f8c8d; font-weight: 600; }

        .data-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 30px; 
        }

        .data-item { 
            display: flex; 
            border-bottom: 1px solid #f0f0f0; 
            padding: 8px 0; 
        }
        
        .label { font-weight: 700; width: 120px; color: var(--primary); }
        .value { flex: 1; color: #2c3e50; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #bdc3c7;
        }
        
        th, td { 
            border: 1px solid #bdc3c7; 
            padding: 12px 8px; 
            text-align: center; 
            font-size: 14px; 
        }
        
        th { background: #f8fafc; color: var(--primary); font-weight: 700; border-bottom: 2px solid var(--primary); }
        tr:nth-child(even) { background: #fcfcfc; }

        .section-title { 
            background: var(--primary); 
            color: white; 
            padding: 8px 15px; 
            margin: 25px 0 10px 0; 
            font-weight: bold; 
            border-radius: 4px;
            font-size: 16px;
        }

        #status-msg { margin-top: 15px; font-weight: bold; color: var(--accent); font-size: 18px; }

        /* ستايل لوحة الإدارة السرية */
        #admin-panel {
            max-width: 900px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary);
            display: none; 
        }
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 14px; }
        .card p { margin: 10px 0 0 0; font-size: 24px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div id="admin-panel">
    <h2>📊 لوحة الإحصائيات الإدارية (الريل تايم)</h2>
    <div class="stats-cards">
        <div class="card">
            <h3>دخلوا اليوم</h3>
            <p id="stat-today">0</p>
        </div>
        <div class="card">
            <h3>دخلوا هذا الشهر</h3>
            <p id="stat-month">0</p>
        </div>
        <div class="card">
            <h3>إجمالي الزيارات المسجلة</h3>
            <p id="stat-total">0</p>
        </div>
    </div>
    
    <h3>🌍 توزيع الزوار حسب الدول</h3>
    <table id="countries-table">
        <thead>
            <tr>
                <th>الدولة</th>
                <th>عدد الزيارات</th>
            </tr>
        </thead>
        <tbody id="countries-list">
            <tr><td colspan="2">جاري تحميل البيانات...</td></tr>
        </tbody>
    </table>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
</div>

<div class="no-print" id="input-ui">
    <h2>مركز استخراج التقارير الذكي</h2>
    <textarea id="base64Input" placeholder="أدخل الكود المشفر هنا أو سيتم الكشف عنه تلقائياً من الرابط..."></textarea><br>
    <button class="btn-action" id="submit-btn" onclick="processManualInput()">📋 استخراج المستند الآن</button>
    <div id="status-msg"></div>
</div>

<div id="pdf-content">
    <div class="header">
        <h1>الجمهورية الجزائرية الديمقراطية الشعبية</h1>
        <p id="report-type-title">تقرير إداري</p>
        <p id="current-date"></p>
    </div>
    <div id="dynamic-body"></div>
</div>

<script>
// 1. تهيئة الفايربيس بالإعدادات الخاصة بك
const firebaseConfig = {
  apiKey: "AIzaSyDGCJX_OFXr0OM-ZAS3HzMBZyQmag6uZAI",
  authDomain: "bank-zift.firebaseapp.com",
  databaseURL: "https://bank-zift-default-rtdb.firebaseio.com",
  projectId: "bank-zift",
  storageBucket: "bank-zift.firebasestorage.app",
  messagingSenderId: "653679280221",
  appId: "1:653679280221:web:d3512c56df4ff7d9b8cdb4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// تحديد مدة الانتظار بالثواني (يمكنك تغيير الـ 15 لأي مدة تريدها)
const WAITING_TIME = 15; 

// 2. كود تسجيل الزيارة فور دخول الصفحة
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
        document.getElementById('admin-panel').style.display = 'block';
        loadAdminStats(); 
        return; 
    }

    fetch('https://ipapi.co/json/')
    .then(res => res.json())
    .then(data => {
        logVisit(data.country_name || "غير معروف");
    })
    .catch(() => {
        logVisit("غير معروف");
    });
});

function logVisit(country) {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const todayStr = `${year}-${month}-${day}`;
    const monthStr = `${year}-${month}`;

    const visitRef = db.ref('visits').push();
    visitRef.set({
        date: todayStr,
        month: monthStr,
        country: country,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    });
}

// 3. كود لوحة التحكم وجلب الإحصائيات (ريل تايم)
function loadAdminStats() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const todayStr = `${year}-${month}-${day}`;
    const monthStr = `${year}-${month}`;

    db.ref('visits').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        let todayCount = 0;
        let monthCount = 0;
        let totalCount = 0;
        let countriesMap = {};

        for (let key in data) {
            totalCount++;
            let visit = data[key];
            
            if (visit.date === todayStr) todayCount++;
            if (visit.month === monthStr) monthCount++;
            
            if (visit.country) {
                countriesMap[visit.country] = (countriesMap[visit.country] || 0) + 1;
            }
        }

        document.getElementById('stat-today').innerText = todayCount;
        document.getElementById('stat-month').innerText = monthCount;
        document.getElementById('stat-total').innerText = totalCount;

        const tbody = document.getElementById('countries-list');
        tbody.innerHTML = "";
        
        const sortedCountries = Object.entries(countriesMap).sort((a, b) => b[1] - a[1]);
        sortedCountries.forEach(([country, count]) => {
            tbody.innerHTML += `<tr><td>${country}</td><td>${count}</td></tr>`;
        });
    });
}

// 4. منطق معالجة الـ PDF مع العداد التنازلي الإجباري
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const dataFromUrl = urlParams.get('data');
    if (dataFromUrl) {
        document.getElementById('base64Input').value = dataFromUrl;
        // إذا جاءت البيانات من الرابط تلقائياً، تبدأ عملية العد التنازلي فوراً
        startCountdown(dataFromUrl);
    }
    document.getElementById('current-date').innerText = "تاريخ الاستخراج: " + new Date().toLocaleDateString('ar-DZ');
};

function processManualInput() {
    const text = document.getElementById('base64Input').value;
    if(!text) { alert("يرجى إدخل البيانات"); return; }
    startCountdown(text);
}

// دالة تشغيل العداد التنازلي الإجباري
function startCountdown(encodedData) {
    let timeLeft = WAITING_TIME;
    const btn = document.getElementById('submit-btn');
    
    // تعطيل الزر حتى لا يضغط المستخدم مجدداً
    btn.disabled = true;
    
    showStatus(`⏳ جاري تحضير ملفك، يرجى الانتظار: ${timeLeft} ثانية...`);

    const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            // المتابعة لمعالجة البيانات وتوليد الـ PDF بعد انتهاء الوقت
            executeDataExtraction(encodedData);
        } else {
            showStatus(`⏳ جاري تحضير ملفك، يرجى الانتظار: ${timeLeft} ثانية...`);
        }
    }, 1000);
}

// فك التشفير وعرض المحتوى
function executeDataExtraction(encodedData) {
    showStatus("⚙️ جاري تحليل البيانات وبناء المستند...");
    try {
        const binaryString = atob(encodedData.trim());
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
        const decoded = JSON.parse(new TextDecoder('utf-8').decode(bytes));

        const container = document.getElementById('dynamic-body');
        container.innerHTML = ""; 
        
        if(decoded["التقرير"] || decoded["Rapport"]) {
            document.getElementById('report-type-title').innerText = decoded["التقرير"] || decoded["Rapport"];
        }

        renderAnyData(decoded, container);

        document.getElementById('pdf-content').style.display = "block";
        
        showStatus("🖨️ جاري توليد ملف PDF وتحميله...");
        setTimeout(generatePDF, 800);
    } catch (e) { 
        showStatus("❌ فشل: البيانات غير صالحة");
        console.error(e);
    }
}

function renderAnyData(data, container) {
    let grid = document.createElement('div');
    grid.className = "data-grid";
    
    for (let key in data) {
        let value = data[key];
        if (Array.isArray(value)) {
            container.appendChild(grid); 
            grid = document.createElement('div'); 
            grid.className = "data-grid";
            
            container.innerHTML += `<div class="section-title">بيانات: ${key}</div>`;
            container.appendChild(createTable(value));
        } 
        else if (typeof value === 'object' && value !== null) {
            renderAnyData(value, container);
        } 
        else {
            if(key !== "التقرير" && key !== "Rapport") {
                grid.innerHTML += `
                    <div class="data-item">
                        <div class="label">${key}:</div>
                        <div class="value">${value}</div>
                    </div>`;
            }
        }
    }
    if(grid.children.length > 0) container.appendChild(grid);
}

function createTable(array) {
    if (array.length === 0) return document.createElement('div');
    const table = document.createElement('table');
    const headers = Object.keys(array[0]);
    let html = `<thead><tr><th style="width:35px">#</th>`;
    headers.forEach(h => html += `<th>${h}</th>`);
    html += `</tr></thead><tbody>`;
    array.forEach((item, index) => {
        html += `<tr><td>${index + 1}</td>`;
        headers.forEach(h => {
            let val = item[h] || "-";
            if(val === 'present') val = '<span style="color:green">حاضر</span>';
            if(val === 'absent') val = '<span style="color:red">غائب</span>';
            html += `<td>${val}</td>`;
        });
        html += `</tr>`;
    });
    table.innerHTML = html + `</tbody>`;
    return table;
}

function generatePDF() {
    const element = document.getElementById('pdf-content');
    const opt = {
        margin: [10, 0, 10, 0],
        filename: 'Report_Official.pdf',
        image: { type: 'jpeg', quality: 1.0 },
        html2canvas: { 
            scale: 2, 
            useCORS: true,
            letterRendering: false,
            dpi: 300
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };
    html2pdf().set(opt).from(element).save().then(() => {
        showStatus("✅ تم تحميل التقرير بنجاح");
    });
}

function showStatus(msg) {
    document.getElementById('status-msg').innerText = msg;
}
</script>
</body>
</html>
